{% extends "base.html" %}
{% block title %}Log in — Invigilation Duties{% endblock %}
{% block content %}
<div class="card login">
  <h1>Invigilation Duties</h1>
  <p class="subtitle">Log in with your university email.</p>
  {% if form.errors %}
    <div class="alert error">Your email or password is incorrect.</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label for="id_username">Email</label>
      <input type="email" name="username" id="id_username" autocomplete="email" required autofocus>
    </div>
    <div class="field">
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
