{% extends "base.html" %}
{% block title %}Forgot password — Invigilation Duties{% endblock %}
{% block content %}
<div class="card login">
  <h1>Forgot your password?</h1>
  <p class="subtitle">Enter your university email and we'll send you a link to set a new one.</p>
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label for="id_email">Email</label>
      <input type="email" name="email" id="id_email" autocomplete="email" required autofocus>
    </div>
    <button type="submit">Send reset link</button>
  </form>
  <p><a href="{% url 'login' %}">Back to login</a></p>
</div>
{% endblock %}
