<table>
  <thead><tr><th>{{ first_label|default:"Department" }}</th><th>Assigned</th><th>Completed</th><th>Absent</th><th>Not yet marked</th><th>Swapped away</th><th>Taken over</th><th>Replaced</th></tr></thead>
  <tbody>
    {% for r in rows %}
    <tr><td>{{ r.department }}</td><td>{{ r.assigned }}</td><td>{{ r.completed }}</td><td>{{ r.absent }}</td><td>{{ r.unmarked }}</td><td>{{ r.swapped_away }}</td><td>{{ r.taken_over }}</td><td>{{ r.replaced }}</td></tr>
    {% endfor %}
  </tbody>
</table>
